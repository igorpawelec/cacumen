# R CMD check of the rcacumen package in r/, across the platforms CRAN
# builds on. Runs only when that folder or this file changes. The check that
# rcacumen and pycacumen agree, which the README's central claim rests on,
# is parity.yml: it has to run when either package changes.
#
# The package compiles plain C with no Rcpp, so the matrix is about
# compiler and R-version drift rather than about dependencies: `stats` is
# the only import, and `terra` is a Suggests used solely by R/io.R.

on:
  push:
    branches: [main]
    paths: ["r/**", ".github/workflows/R-CMD-check.yaml"]
  pull_request:
    paths: ["r/**", ".github/workflows/R-CMD-check.yaml"]
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          # DESCRIPTION declares R (>= 3.6.0); oldrel-1 is the oldest R the
          # actions provide, and it is what catches an accidental use of a
          # newer base function.
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # Without pandoc, `checking top-level files` NOTEs on README.md and
      # NEWS.md, which the package does ship.
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: r

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          # --no-manual skips the PDF manual, which needs a LaTeX install.
          # Note what that costs: `checking PDF version of manual` is a real
          # CRAN check and it is NOT covered here, so run
          # `R CMD check --as-cran` locally with LaTeX present before
          # submitting. Everything else --as-cran does runs below.
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual")'
          # NOTEs do not fail the build: a first submission always NOTEs
          # "New submission", and there is no way to satisfy it.
          error-on: '"warning"'
          upload-snapshots: true
