# The agreement between the two packages: rcacumen in r/ against pycacumen in
# python/, both taken from the commit under test. Runs when either folder
# changes, because either side can break it.

on:
  push:
    branches: [main]
    paths: ["python/**", "r/**", ".github/workflows/parity.yml"]
  pull_request:
    paths: ["python/**", "r/**", ".github/workflows/parity.yml"]
  workflow_dispatch:

name: parity

permissions: read-all

jobs:
  identical:
    # The README claims rcacumen and pycacumen are identical pixel for pixel on
    # the small synthetic scenes and that this is checked rather than asserted. r/tools/ holds that check but
    # it needs Python, which CRAN machines do not have — so it never ran
    # anywhere automatically. GitHub runners do have Python, so it runs here.
    #
    # Scope, stated plainly: this covers the 70 synthetic scenes the
    # generator builds. The 60 small ones must match exactly, the 10 large
    # crowded ones within 0.5 % of pixels. On the seven real tiles of the
    # repository, smoothing, detection and mask must agree as well; what the
    # watershed and the finished crowns differ by there is measured and
    # printed, not bounded, because the two watersheds break plateau ties
    # differently.
    runs-on: ubuntu-latest
    name: rcacumen against pycacumen

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        working-directory: r

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          working-directory: r

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pycacumen from this commit
        # From python/ in the same checkout, so the two halves of one commit
        # are compared with each other. A change to either package that
        # breaks the agreement fails here before it reaches main.
        # With the io extra: the reference generator reads the real tiles of
        # test_data with rasterio.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "../python[io]"

      - name: Check the version declarations agree
        # CITATION.cff is .Rbuildignore'd, so R CMD check never sees it;
        # it sat two releases behind DESCRIPTION before this step existed.
        run: Rscript tools/check_versions.R

      - name: Install rcacumen
        run: R CMD INSTALL .

      - name: Generate reference crowns from pycacumen
        run: python tools/generate_pycacumen_reference.py

      - name: Compare rcacumen against them
        # cross_validate_against_pycacumen.R stops non-zero on a single differing
        # pixel in a small scene, or above 0.5 % of pixels in the large ones.
        run: Rscript tools/cross_validate_against_pycacumen.R

      - name: Hold the watershed against scikit-image's
        # Flooded from the detected tops, the smooth random scenes have to
        # come out identical; what the plateau scenes differ by is printed.
        run: Rscript tools/watershed_against_skimage.R

      - name: Run the README quick start on every test tile
        # The synthetic scenes above never call merge_tops() or screen_tops().
        # The README's quick start does, and on the real tiles, which have
        # holes, two of the seven stopped rcacumen 0.5.0. Runs the call on
        # each tile and holds the number of tops against pycacumen's.
        run: Rscript tools/quick_start_on_test_tiles.R

      - name: Measure the agreement on the real tiles, stage by stage
        # Smoothing, detection and mask have to agree on every tile and fail
        # the job when they do not. The watershed and the finished crowns are
        # reported: these are the figures the README quotes for real canopy
        # height models.
        run: Rscript tools/real_tiles_stage_by_stage.R
