# The agreement between the two packages: rcacumen in r/ against pycacumen in
# python/, both taken from the commit under test. Runs when either folder
# changes, because either side can break it.

on:
  push:
    branches: [main]
    paths: ["python/**", "r/**", ".github/workflows/parity.yml"]
  pull_request:
    paths: ["python/**", "r/**", ".github/workflows/parity.yml"]
  workflow_dispatch:

name: parity

permissions: read-all

jobs:
  identical:
    # The README claims rcacumen and pycacumen are identical pixel for pixel and
    # that this is checked rather than asserted. r/tools/ holds that check but
    # it needs Python, which CRAN machines do not have — so it never ran
    # anywhere automatically. GitHub runners do have Python, so it runs here.
    #
    # Scope, stated plainly: this covers the 60 synthetic scenes the
    # generator builds. It does not cover agreement on real canopy height
    # models, which is a separate open question.
    runs-on: ubuntu-latest
    name: rcacumen identical to pycacumen

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        working-directory: r

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          working-directory: r

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pycacumen from this commit
        # From python/ in the same checkout, so the two halves of one commit
        # are compared with each other. A change to either package that
        # breaks the agreement fails here before it reaches main.
        run: |
          python -m pip install --upgrade pip
          python -m pip install ../python

      - name: Check the version declarations agree
        # CITATION.cff is .Rbuildignore'd, so R CMD check never sees it;
        # it sat two releases behind DESCRIPTION before this step existed.
        run: Rscript tools/check_versions.R

      - name: Install rcacumen
        run: R CMD INSTALL .

      - name: Generate reference crowns from pycacumen
        run: python tools/generate_pycacumen_reference.py

      - name: Compare rcacumen against them
        # cross_validate_against_pycacumen.R stops non-zero on any disagreement,
        # so a single differing pixel fails the job.
        run: Rscript tools/cross_validate_against_pycacumen.R
